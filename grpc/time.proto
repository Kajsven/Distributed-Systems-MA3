syntax = "proto3";

package chatservice.v1;

option go_package = "Distributed-Systems-MA3/grpc/chat";

import "google/protobuf/timestamp.proto";

service ChatService {
  rpc PostMessage(PostCurrentMessage) returns (PostCurrentMessageResponse);

}

message PostCurrentMessage {
  google.protobuf.Timestamp time = 1;
  string message = 2;
}

message PostCurrentMessageResponse {
  bool success = 1;
}