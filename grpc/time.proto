syntax = "proto3";

package chatservice.v1;

option go_package = "Distributed-Systems-MA3/grpc/chat";

import "google/protobuf/timestamp.proto";

service ChatService {
  rpc PostMessage(PostCurrentMessage) returns (PostCurrentMessageResponse);
  rpc Connect(ConnectRequest) returns (stream BroadCast);
  rpc GetId(RequestId) returns (ResponseId);
}

message PostCurrentMessage {
  int64 time = 1;
  string message = 2;
  int32 clientId = 3;
}

message PostCurrentMessageResponse {
  bool success = 1;
}

message ConnectRequest {
  int32 clientId = 1;
  string username = 2;
}

message BroadCast {
  int64 time = 1;
  string message = 2;
  string username = 3;
}

message RequestId{}

message ResponseId{
  int32 clientId = 1;
}